name: Build Lipi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: lipi-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Lipi
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Verify the project
        run: |
          npx tsc --noEmit
          npm run lint
          npm run validate:curriculum
          npm run audio:validate

      - name: Generate the Android project
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      - name: Build installable release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Enforce the 350 MB application limit
        run: |
          apk_bytes=$(stat -c%s android/app/build/outputs/apk/release/app-release.apk)
          max_bytes=$((350 * 1024 * 1024))
          echo "Release APK: $((apk_bytes / 1024 / 1024)) MB"
          test "$apk_bytes" -le "$max_bytes"

      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Lipi-1.6.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: Lipi-Android-1.6.0
          path: Lipi-1.6.0.apk
          if-no-files-found: error
          retention-days: 30
